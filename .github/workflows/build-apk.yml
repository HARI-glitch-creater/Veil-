name: Build Veil Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & install Android 36 SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDKMANAGER" --install "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing keystore
        run: |
          if [ ! -s debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              base64 -di debug.keystore.base64 > debug.keystore || rm -f debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Rename APK for download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/Veil-debug.apk
          ls -lh release-apk/Veil-debug.apk

      - name: Upload Veil APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veil-Android-APK
          path: release-apk/Veil-debug.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/Veil-debug.apk
          generate_release_notes: true
